[project]
name = "isrm"
version = "0.1.0"
description = "Internet service risk manager"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "cryptography>=42.0",
    "openai>=1.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pydantic-ai>=0.0.14",
    "tavily-python>=0.3",
]

[project.scripts]
isrm = "isrm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isrm"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
]
